<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b46">
  <meta name="description" content="Controle compartilhado do caixa da Cantina do Grêmio.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <title>Cantina do Grêmio</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Cantina do Grêmio - início">
        <span class="brand-mark" aria-hidden="true">CG</span>
        <span class="brand-copy"><strong>Cantina do Grêmio</strong><small>Controle de caixa</small></span>
      </a>
      <div class="topbar-actions">
        <span id="connection-status" class="connection-pill"><i></i><span>Verificando conexão</span></span>
        <button id="install-button" class="button button-quiet button-small hidden" type="button">Instalar app</button>
        <button id="logout-button" class="button button-quiet button-small hidden" type="button">Sair</button>
      </div>
    </header>

    <main id="app-root" class="main-content" aria-live="polite">
      <section class="loading-state"><span class="spinner"></span><p>Preparando a Cantina do Grêmio…</p></section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> | Criado e Desenvolvido por Pedro Costa</span>
      <a href="mailto:desenvolvedorpedrocosta@gmail.com">desenvolvedorpedrocosta@gmail.com</a>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
