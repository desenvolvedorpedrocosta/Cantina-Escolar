<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b46">
  <meta name="description" content="Aplicativo de vendas e controle do caixa da Cantina da Escola.">
  <meta name="application-name" content="Cantina da Escola">
  <meta name="apple-mobile-web-app-title" content="Cantina da Escola">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Captura beforeinstallprompt antes que os módulos ES iniciem. -->
  <script src="./js/install-bridge.js"></script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <title>Cantina da Escola</title>
</head>
<body>
  <div id="splash-screen" class="splash-screen" aria-label="Abrindo Cantina da Escola">
    <div class="splash-content">
      <div class="splash-icon" aria-hidden="true">🥪</div>
      <p class="splash-kicker">Bem-vindo à</p>
      <h1>Cantina da Escola</h1>
      <p class="splash-message">Preparando o caixa…</p>
      <div class="splash-progress" role="progressbar" aria-label="Carregando aplicativo"><span></span></div>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Cantina da Escola - início">
        <span class="brand-mark" aria-hidden="true">CE</span>
        <span class="brand-copy"><strong>Cantina da Escola</strong><small>Controle de caixa</small></span>
      </a>
      <div class="topbar-actions">
        <span id="connection-status" class="connection-pill"><i></i><span>Verificando conexão</span></span>
        <button id="install-button" class="button button-quiet button-small hidden" type="button">Instalar app</button>
        <button id="logout-button" class="button button-quiet button-small hidden" type="button">Sair</button>
      </div>
    </header>

    <main id="app-root" class="main-content" aria-live="polite">
      <section class="loading-state"><span class="spinner"></span><p>Preparando a Cantina da Escola…</p></section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> | Criado e Desenvolvido por Pedro Costa</span>
      <a href="mailto:desenvolvedorpedrocosta@gmail.com">desenvolvedorpedrocosta@gmail.com</a>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="app-dialog-title">
    <div id="app-dialog-content"></div>
  </dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
